name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jobs are split by what they protect, not by stage, so a cheap failure reports
# in seconds instead of queueing behind a compile.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # Runs before clippy: a file that crossed 150 lines should report in
      # seconds rather than after a full lint pass.
      - run: cargo xtask check

  # The audit tooling is Python in a Rust workspace, so no cargo gate covers
  # it. Without this job a change there breaks nothing visible until someone
  # has an API key, and the failure looks like a configuration problem.
  audit-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No API key: every guard these cover sits before the first request, and
      # the one test that needs an answer supplies its own stub.
      - run: python3 -m unittest discover -s audits -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      # Nothing here talks to the API: the command crates are driven through the
      # command graph in-process, so this job stays offline and deterministic.
      # Live conformance belongs to the SDK, and runs in typesafe-sdk-rs.
      - run: cargo test --workspace --locked
