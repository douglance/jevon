[package]
name = "jevon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line interface and MCP server for the TypeSafe API."

[[bin]]
name = "jev"
path = "src/main.rs"

# The former name, kept so anything already written against it keeps working.
[[bin]]
name = "typesafe"
path = "src/main.rs"

[dependencies]
incurs = { workspace = true, features = ["mcp", "yaml"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
typesafe-sdk-cmd-ask.workspace = true
typesafe-sdk-cmd-doctor.workspace = true
typesafe-sdk-cmd-models.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
