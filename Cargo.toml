[workspace]
members = ["crates/*", "xtask"]
default-members = ["crates/jevon"]
resolver = "3"

[workspace.package]
version = "0.7.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/douglance/jevon"
homepage = "https://github.com/douglance/jevon"
readme = "README.md"
keywords = ["typesafe", "llm", "cli", "mcp", "agent"]
categories = ["command-line-utilities", "api-bindings"]

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -4 }
cargo = { level = "deny", priority = -4 }
nursery = { level = "deny", priority = -4 }
pedantic = { level = "deny", priority = -4 }
cognitive_complexity = "deny"
dbg_macro = "deny"
excessive_nesting = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
type_complexity = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
# Transitive duplicates in the reqwest/incurs trees are not fixable from here.
multiple_crate_versions = "allow"
# Conflicts with `unreachable_pub`: an internal helper in a private module must
# be `pub(crate)` to satisfy one lint and plain `pub` to satisfy the other.
# `unreachable_pub` is the one worth keeping, because it catches a `pub` that
# widens the API by accident, which this lint cannot.
redundant_pub_crate = "allow"

[workspace.dependencies]
# Command crates, which live here. Listed so the graph is visible in one place.
typesafe-sdk-cmd-kit      = { path = "crates/typesafe-sdk-cmd-kit",      version = "0.7.1" }
typesafe-sdk-cmd-ask      = { path = "crates/typesafe-sdk-cmd-ask",      version = "0.7.1" }
typesafe-sdk-cmd-classify = { path = "crates/typesafe-sdk-cmd-classify", version = "0.7.1" }
typesafe-sdk-cmd-doctor   = { path = "crates/typesafe-sdk-cmd-doctor",   version = "0.7.1" }
typesafe-sdk-cmd-models   = { path = "crates/typesafe-sdk-cmd-models",   version = "0.7.1" }

# The SDK, consumed from crates.io like any other user would. Depending on it by
# version rather than by path is the point of the split: the commands are held
# to the published API, so an accidental reach into a private corner of the SDK
# fails here rather than after a release.
typesafe-sdk-answers   = "0.6"
typesafe-sdk-client    = "0.6"
typesafe-sdk-config    = "0.6"
typesafe-sdk-env       = "0.6"
typesafe-sdk-error     = "0.6"
typesafe-sdk-headers   = "0.6"
typesafe-sdk-http      = "0.6"
typesafe-sdk-models    = "0.6"
typesafe-sdk-questions = "0.6"

# Third party.
anyhow = "1"
futures = "0.3"
incurs = "0.7"
indexmap = { version = "2", features = ["serde"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
toml = "0.9"
walkdir = "2"
