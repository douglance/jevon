[workspace]
members = ["crates/*", "xtask"]
default-members = ["crates/typesafe-sdk-cli"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/douglance/typesafe-sdk-rs"
homepage = "https://github.com/douglance/typesafe-sdk-rs"
readme = "README.md"
keywords = ["typesafe", "llm", "sdk", "cli", "mcp"]
categories = ["api-bindings", "command-line-utilities"]

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -4 }
cargo = { level = "deny", priority = -4 }
nursery = { level = "deny", priority = -4 }
pedantic = { level = "deny", priority = -4 }
cognitive_complexity = "deny"
dbg_macro = "deny"
excessive_nesting = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"
type_complexity = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
# Transitive duplicates in the reqwest/incurs trees are not fixable from here.
multiple_crate_versions = "allow"

[workspace.dependencies]
# Internal crates. Listed here so the dependency graph is visible in one place.
typesafe-sdk-answers   = { path = "crates/typesafe-sdk-answers",   version = "0.6.0" }
typesafe-sdk-client    = { path = "crates/typesafe-sdk-client",    version = "0.6.0" }
typesafe-sdk-cmd-ask   = { path = "crates/typesafe-sdk-cmd-ask",   version = "0.6.0" }
typesafe-sdk-cmd-doctor = { path = "crates/typesafe-sdk-cmd-doctor", version = "0.6.0" }
typesafe-sdk-cmd-kit   = { path = "crates/typesafe-sdk-cmd-kit",   version = "0.6.0" }
typesafe-sdk-cmd-models = { path = "crates/typesafe-sdk-cmd-models", version = "0.6.0" }
typesafe-sdk-config    = { path = "crates/typesafe-sdk-config",    version = "0.6.0" }
typesafe-sdk-derive    = { path = "crates/typesafe-sdk-derive",    version = "0.6.0" }
typesafe-sdk-env       = { path = "crates/typesafe-sdk-env",       version = "0.6.0" }
typesafe-sdk-error     = { path = "crates/typesafe-sdk-error",     version = "0.6.0" }
typesafe-sdk-headers   = { path = "crates/typesafe-sdk-headers",   version = "0.6.0" }
typesafe-sdk-http      = { path = "crates/typesafe-sdk-http",      version = "0.6.0" }
typesafe-sdk-log       = { path = "crates/typesafe-sdk-log",       version = "0.6.0" }
typesafe-sdk-models    = { path = "crates/typesafe-sdk-models",    version = "0.6.0" }
typesafe-sdk-questions = { path = "crates/typesafe-sdk-questions", version = "0.6.0" }
typesafe-sdk-retry     = { path = "crates/typesafe-sdk-retry",     version = "0.6.0" }
typesafe-sdk-runtime   = { path = "crates/typesafe-sdk-runtime",   version = "0.6.0" }

# Third party.
anyhow = "1"
http = "1"
incurs = "0.7"
indexmap = { version = "2", features = ["serde"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
toml = "0.9"
walkdir = "2"
